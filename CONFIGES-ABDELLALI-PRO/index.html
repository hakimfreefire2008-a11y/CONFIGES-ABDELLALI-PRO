<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONFIGES ABDELLALI PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:linear-gradient(135deg,#2563eb,#9333ea);
padding:25px;
text-align:center;
border-radius:0 0 30px 30px;
}

h1{
margin:0;
}


.container{
padding:15px;
}


input{
width:90%;
padding:15px;
border-radius:20px;
border:0;
margin:15px;
}


.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}


button,.card{
background:#1e293b;
color:white;
border:0;
padding:18px;
border-radius:20px;
cursor:pointer;
}


.server{
background:#334155;
margin-top:15px;
padding:15px;
border-radius:20px;
}


.copy{
background:#2563eb;
padding:10px;
border-radius:15px;
}

</style>

</head>


<body>


<header>

<h1>⚡ CONFIGES ABDELLALI PRO</h1>

<p>Premium Config Servers</p>

</header>



<div class="container">


<input id="search" placeholder="🔎 بحث عن سيرفر..." onkeyup="searchServer()">



<div class="menu">

<button onclick="filter('SSH')">🔐 SSH</button>

<button onclick="filter('VLESS')">🚀 VLESS</button>

<button onclick="filter('VMESS')">⚡ VMESS</button>

<button onclick="filter('UDP')">🌐 UDP</button>

<button onclick="showHC()">📁 HTTP CUSTOM</button>

<button onclick="loadServers()">🔄 تحديث</button>

</div>



<h2 id="title">
السيرفرات
</h2>


<div id="servers"></div>


</div>



<script>


let data=[];



// تحميل السيرفرات من JSON

function loadServers(){


fetch("servers.json")

.then(r=>r.json())

.then(json=>{


data=json.servers;

display(data);


})

.catch(()=>{

document.getElementById("servers").innerHTML=

"❌ لم يتم العثور على servers.json";


});


}



function display(list){


let box=document.getElementById("servers");

box.innerHTML="";


list.forEach(s=>{


box.innerHTML+=`

<div class="server">

<h3>${s.country}</h3>

📡 النوع: ${s.type}

<br>

⚡ السرعة: ${s.speed}

<br>

📶 Ping: ${s.ping} ms

<br>

📅 الانتهاء: ${s.expire}


<br><br>


<button class="copy" onclick="copy('${s.config}')">

نسخ الكونفيج

</button>


</div>

`;


});


}




function filter(type){


let result=data.filter(

s=>s.type==type

);


display(result);


}



function searchServer(){


let text=document
.getElementById("search")
.value
.toLowerCase();



let result=data.filter(s=>

s.country.toLowerCase()
.includes(text)

);



display(result);


}



function copy(text){

navigator.clipboard.writeText(text);

alert("✅ تم نسخ الكونفيج");

}




function showHC(){


let box=document.getElementById("servers");


box.innerHTML="";


fetch("servers.json")

.then(r=>r.json())

.then(j=>{


j.hc.forEach(file=>{


box.innerHTML+=`

<div class="server">

📁 ${file.name}

<br><br>

<a href="${file.url}">

<button>

تحميل ملف HC

</button>

</a>


</div>


`;


});


});


}



loadServers();


</script>


</body>
</html>
